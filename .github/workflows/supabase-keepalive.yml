# Free Supabase projects pause after about a week without activity.
# This reads one row every 3 days so the comments and the Sky of Observers stay online.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one mark
        env:
          SUPABASE_URL: https://lnswhympyfgllnddczse.supabase.co
          # Publishable key: safe to be public; row-level security protects the data.
          SUPABASE_KEY: sb_publishable_hWRYJK9OTbGDlW3UWLvUiQ_B8r2B11w
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/marks?select=number&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered $status"
          test "$status" = "200"
